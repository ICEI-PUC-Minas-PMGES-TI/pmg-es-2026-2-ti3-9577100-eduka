# Perfil de producao (SPRING_PROFILES_ACTIVE=prod). Carregado por cima de
# application.properties: o que esta aqui vence, o resto e herdado.
#
# Nenhuma credencial tem valor default. Se a variavel de ambiente nao existir,
# o Spring falha na subida com "Could not resolve placeholder", que e o
# comportamento desejado: melhor nao subir do que subir com senha conhecida.

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB}?sslmode=${DB_SSLMODE}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}

# Nunca logar SQL em producao: exporia dados pessoais e hashes de senha nos logs.
spring.jpa.show-sql=false

# Respostas de erro nao carregam stack trace, mensagem interna nem nome de
# excecao para o cliente.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
