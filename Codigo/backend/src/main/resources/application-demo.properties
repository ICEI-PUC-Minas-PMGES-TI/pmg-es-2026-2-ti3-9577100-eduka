# Ambiente de apresentacao: SPRING_PROFILES_ACTIVE=prod,demo. Tudo do perfil
# prod continua valendo (credenciais sem default, Swagger desligado...); este
# arquivo vem por ultimo e so libera o que a demonstracao precisa:
#   - a escola de demonstracao do MockDataSeeder (Colegio Ipe Amarelo);
#   - os atalhos de Sandbox do provedor de pagamento (SandboxController);
#   - a tela /login/demo (DemoController), protegida por login e senha.
# Nunca usar o perfil demo na producao de verdade.

app.mock.habilitado=true

# Sem default: as senhas do mock e do acesso nao podem ser as publicadas no README.
app.mock.senha=${MOCK_SENHA}
app.demo.acesso.login=${DEMO_ACESSO_LOGIN}
app.demo.acesso.senha=${DEMO_ACESSO_SENHA}
