spring.application.name=eduka

# Perfil padrao = desenvolvimento local. Os defaults abaixo existem so para
# conveniencia em dev; o perfil "prod" (application-prod.properties) sobrescreve
# tudo isso sem default nenhum, para que variavel faltando derrube a aplicacao
# em vez de subir com credencial conhecida.

# DB_SSLMODE=disable por padrao (sem TLS). Em producao, gerar certificado e trocar
# para DB_SSLMODE=verify-full — ainda nao ativado, isto e apenas o parametro preparado.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:eduka}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_APP_USER:eduka_app}
spring.datasource.password=${DB_APP_PASSWORD:changeme-app}

spring.jpa.hibernate.ddl-auto=validate

# Loga toda query SQL. Util em dev, desligado em prod.
spring.jpa.show-sql=true

# Sem default de proposito: e validado em JwtConfig (obrigatorio, >= 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Sem default de proposito, mesmo padrao do jwt.secret: falta a variavel
# derruba a app em vez de subir com chave conhecida.
pii.encryption.key=${PII_ENCRYPTION_KEY}
pii.encryption.key-version=1

# Origens autorizadas a chamar a API a partir do browser (CORS). Em dev, o Vite.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger UI em /swagger-ui.html (desligado em prod). Mantem o token do
# "Authorize" ao recarregar a pagina e ordena rotas e grupos alfabeticamente.
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Endereco do front usado nos links dos e-mails (ex.: primeiro acesso).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Por quantos dias a senha provisoria (CPF) do primeiro acesso vale.
app.acesso.senha-provisoria-validade-dias=${SENHA_PROVISORIA_VALIDADE_DIAS:7}

# E-mail transacional pelo Brevo. Sem BREVO_API_KEY o backend sobe normalmente
# e so registra no log os e-mails que teria enviado (ver EmailConfig).
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=https://api.brevo.com/v3
brevo.remetente-email=${BREVO_REMETENTE_EMAIL:nao-responda@eduka.com.br}
brevo.remetente-nome=${BREVO_REMETENTE_NOME:Eduka}
