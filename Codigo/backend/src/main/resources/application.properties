spring.application.name=eduka

# Porta HTTP. Hospedagens como o Render informam a porta em PORT; no Docker
# Compose ela nao existe e fica a 8080 de sempre.
server.port=${PORT:8080}

# Perfil padrao = desenvolvimento local. Os defaults abaixo existem so para
# conveniencia em dev; o perfil "prod" (application-prod.properties) sobrescreve
# tudo isso sem default nenhum, para que variavel faltando derrube a aplicacao
# em vez de subir com credencial conhecida.

# DB_SSLMODE=disable por padrao (sem TLS). Em producao, gerar certificado e trocar
# para DB_SSLMODE=verify-full — ainda nao ativado, isto e apenas o parametro preparado.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:eduka}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_APP_USER:eduka_app}
spring.datasource.password=${DB_APP_PASSWORD:changeme-app}

spring.jpa.hibernate.ddl-auto=validate

# Loga toda query SQL. Util em dev, desligado em prod.
spring.jpa.show-sql=true

# Sem default de proposito: e validado em JwtConfig (obrigatorio, >= 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Sem default de proposito, mesmo padrao do jwt.secret: falta a variavel
# derruba a app em vez de subir com chave conhecida.
pii.encryption.key=${PII_ENCRYPTION_KEY}
pii.encryption.key-version=1

# Origens autorizadas a chamar a API a partir do browser (CORS). Em dev, o Vite.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger UI em /swagger-ui.html (desligado em prod). Mantem o token do
# "Authorize" ao recarregar a pagina e ordena rotas e grupos alfabeticamente.
# As respostas sao JSON (sem isso, o contrato diz */*); quem devolve outro
# tipo, como o PDF do boleto, declara na propria rota.
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Endereco do front usado nos links dos e-mails (ex.: primeiro acesso).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Primeiro SUPER_ADMIN (SuperAdminInicialSeeder), em qualquer perfil. Vazias =
# nada e criado. So cria se o login ainda nao existe; nunca troca a senha.
app.super-admin.login=${SUPER_ADMIN_LOGIN:}
app.super-admin.senha=${SUPER_ADMIN_SENHA:}

# Escola de demonstracao (mock.MockDataSeeder), so no perfil dev. Fora do
# docker compose fica desligada; o compose de dev liga com MOCK_DATA=true.
app.mock.habilitado=${MOCK_DATA:false}

# Por quantos dias a senha provisoria (CPF) do primeiro acesso vale.
app.acesso.senha-provisoria-validade-dias=${SENHA_PROVISORIA_VALIDADE_DIAS:7}

# Verificacao em duas etapas do login: depois da senha, um codigo de 6 digitos
# vai para o e-mail do usuario e so ele libera os tokens (VerificacaoLoginService).
app.login.verificacao.habilitada=${LOGIN_VERIFICACAO_HABILITADA:true}
# Por quantos minutos cada codigo vale.
app.login.verificacao.validade-minutos=${LOGIN_CODIGO_VALIDADE_MINUTOS:5}
# Codigos errados aceitos antes de exigir um novo login.
app.login.verificacao.max-tentativas=5
# Espera minima entre dois envios e total de envios por login (com o primeiro).
app.login.verificacao.reenvio-intervalo-segundos=60
app.login.verificacao.max-envios=5
# Escreve o codigo no log do backend. So para dev sem BREVO_API_KEY, em que o
# e-mail nao sai; nunca ligar em producao.
app.login.verificacao.codigo-no-log=${LOGIN_CODIGO_NO_LOG:false}

# Rotina diaria que marca como EM_ATRASO as cobrancas vencidas
# (CobrancaAtrasoRotina). Cron do Spring (segundo minuto hora dia mes
# dia-da-semana), no fuso America/Sao_Paulo: todo dia a 00:05.
app.cobranca.atraso.cron=0 5 0 * * *

# Rotina diaria que manda o e-mail de vencimento proximo (3 dias antes) das
# cobrancas pendentes (CobrancaVencimentoRotina). As 8h, no fuso da escola,
# para o e-mail nao chegar de madrugada.
app.cobranca.lembrete.cron=0 0 8 * * *

# Rotina que le no provedor a situacao das contas de recebimento que esperam
# aprovacao (ContaRecebimentoRotina). Cobre o webhook que nao chegou.
app.pagamento.conta.sincronizacao=PT15M

# Rotina que reaplica os avisos do provedor que falharam ou foram
# interrompidos (EventoProvedorRotina). O aviso que chega a max-tentativas
# fica em ERRO para analise manual; cada execucao pega ate lote avisos.
app.pagamento.eventos.reprocessamento=PT5M
app.pagamento.eventos.max-tentativas=10
app.pagamento.eventos.lote=50

# Rotina que procura no provedor, pela referencia, as cobrancas e faturas que
# ficaram EMITINDO sem resposta (ReconciliacaoRotina). So entram as emissoes
# iniciadas ha mais de 5 minutos; cada execucao pega ate lote de cada. Tambem
# confere o pagamento das faturas EMITIDAS em aberto (conta-pai sem webhook).
app.pagamento.reconciliacao.intervalo=PT1M
app.pagamento.reconciliacao.lote=50

# Fila de notificacoes (NotificacaoService). Cada e-mail tem uma tentativa
# logo apos o commit; se falhar, a rotina tenta de novo a cada intervalo, com
# espera crescente (inicial, x4, x16... ate o teto) e no maximo
# max-tentativas envios ao todo.
app.notificacao.intervalo=PT30S
app.notificacao.max-tentativas=6
app.notificacao.espera-inicial=PT1M
app.notificacao.espera-maxima=PT2H
app.notificacao.lote=50

# E-mail transacional pelo Brevo. Sem BREVO_API_KEY o backend sobe normalmente
# e so registra no log os e-mails que teria enviado (ver EmailConfig).
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=https://api.brevo.com/v3
brevo.remetente-email=${BREVO_REMETENTE_EMAIL:nao-responda@eduka.com.br}
brevo.remetente-nome=${BREVO_REMETENTE_NOME:Eduka}

# Gateway de pagamento Asaas (ver AsaasConfig). Sem ASAAS_API_KEY o backend
# sobe normalmente e as operacoes de pagamento respondem 503. A conta filha de
# cada escola so ganha webhook com URL, e-mail e token preenchidos.
asaas.api-url=${ASAAS_API_URL:https://api-sandbox.asaas.com}
asaas.api-key=${ASAAS_API_KEY:}
asaas.webhook-url=${ASAAS_WEBHOOK_URL:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
asaas.webhook-email=${ASAAS_WEBHOOK_EMAIL:}
# Cadastra na subida o webhook da conta-pai (faturas da plataforma). Ligar so
# na prod: o Sandbox e compartilhado e um webhook de tunel temporario morre.
asaas.webhook-conta-pai=${ASAAS_WEBHOOK_CONTA_PAI:false}
