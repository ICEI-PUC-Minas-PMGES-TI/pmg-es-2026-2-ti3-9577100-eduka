services:

  postgres:

    image: postgres:16-alpine

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d


  backend:

    build:
      context: ./backend

    restart: always

    depends_on:
      - postgres

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=${DB_SSLMODE}

      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER}

      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      BREVO_API_KEY: ${BREVO_API_KEY:-}

      BREVO_REMETENTE_EMAIL: ${BREVO_REMETENTE_EMAIL:-nao-responda@eduka.com.br}

      BREVO_REMETENTE_NOME: ${BREVO_REMETENTE_NOME:-Eduka}

      LOGIN_VERIFICACAO_HABILITADA: ${LOGIN_VERIFICACAO_HABILITADA:-true}

      # Primeiro super admin (SuperAdminInicialSeeder). Sem eles o banco nasce sem ninguem que entre.
      SUPER_ADMIN_LOGIN: ${SUPER_ADMIN_LOGIN:-}

      SUPER_ADMIN_SENHA: ${SUPER_ADMIN_SENHA:-}

      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com}

      ASAAS_API_KEY: ${ASAAS_API_KEY:-}

      ASAAS_WEBHOOK_URL: ${ASAAS_WEBHOOK_URL:-}

      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}

      ASAAS_WEBHOOK_EMAIL: ${ASAAS_WEBHOOK_EMAIL:-}
      ASAAS_WEBHOOK_CONTA_PAI: ${ASAAS_WEBHOOK_CONTA_PAI:-false}


  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    restart: always


  nginx:

    image: nginx:alpine

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend


volumes:

  postgres_data: