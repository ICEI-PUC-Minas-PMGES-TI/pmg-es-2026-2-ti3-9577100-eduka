services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface web para o banco, so em dev (nao existe no compose de prod).
  # O servidor "eduka (docker)" ja vem cadastrado via pgadmin/servers.json;
  # na primeira conexao o pgAdmin pede a senha de POSTGRES_PASSWORD.
  pgadmin:
    image: dpage/pgadmin4:9

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # Fica so em localhost; sem necessidade de HTTPS nem de senha master extra.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "${PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

    depends_on:
      postgres:
        condition: service_healthy

  # Carrega postgres/mock/mock.sql depois que o backend aplica as migrations,
  # e encerra. So em dev (nao existe no compose de prod). O mock.sql nao duplica
  # nada, entao rodar a cada "up" e seguro. Com MOCK_DATA=false nao carrega nada.
  mock:
    image: postgres:16-alpine

    environment:
      MOCK_DATA: ${MOCK_DATA:-true}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres/mock:/mock:ro
      - ./backend/src/main/resources/db/migration:/migrations:ro

    entrypoint: ["sh", "/mock/load-mock.sh"]

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=${DB_SSLMODE}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_REMETENTE_EMAIL: ${BREVO_REMETENTE_EMAIL:-nao-responda@eduka.com.br}
      BREVO_REMETENTE_NOME: ${BREVO_REMETENTE_NOME:-Eduka}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_URL: ${ASAAS_WEBHOOK_URL:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_WEBHOOK_EMAIL: ${ASAAS_WEBHOOK_EMAIL:-}
      ASAAS_WEBHOOK_CONTA_PAI: ${ASAAS_WEBHOOK_CONTA_PAI:-false}
      LOGIN_VERIFICACAO_HABILITADA: ${LOGIN_VERIFICACAO_HABILITADA:-true}
      LOGIN_CODIGO_VALIDADE_MINUTOS: ${LOGIN_CODIGO_VALIDADE_MINUTOS:-5}
      # Em dev o codigo de verificacao tambem sai no log do backend, porque sem
      # BREVO_API_KEY o e-mail nao e enviado. Nao existe no compose de prod.
      LOGIN_CODIGO_NO_LOG: ${LOGIN_CODIGO_NO_LOG:-true}
      # Escola de demonstracao com 50 alunos (MockDataSeeder). Nao existe no
      # compose de prod, e o perfil prod ignora mesmo se existisse.
      MOCK_DATA: ${MOCK_DATA:-true}
      SPRING_PROFILES_ACTIVE: dev

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
